; GoH UI4K v2 - proxy d3d11.dll for Call to Arms - Gates of Hell
; Pick "world resolution x interface scale" in the game video settings (e.g. 2560x1440  x2) and press Apply.
;
; enabled  0 = pure passthrough (no hooks), 1 = on
; presets  1 = the game resolution list becomes "world resolution x interface scale" entries; scale below is
;          only the start value then. 0 = old list (native / scale), world = render below
; labels   1 = names for those entries (own translation pack ui4k_labels.pak next to the DLL; game files untouched)
; scale    interface scale without presets: 1.5 or 2 (also fractions like 3/2), range 1..4
; render   world resolution without presets: percent of the monitor (100 = native, 67) or WxH (2560x1440)
; log      0 off, 1 main, 2 verbose  -> ui4k.log next to the DLL
; diag     1 = Ctrl+F11 in game writes the next frames (every draw, target, shader) to ui4k.log - for bug hunting only
; lum_fix  1 = auto-exposure measures the whole 3D image; 0 = game shaders as is
; cb_fix   constant-buffer sizes (in floats) with screen constants: 156 = scene/post-process, 84 = NVIDIA HBAO+
; scan_cb  1 = log screen constants found in any constant buffer (after a game patch: find new sizes)
; hbao_radius  HBAO+ shading radius (RadiusToScreen) is scaled together with the frame size so that shading looks the
;          same as at the native resolution. -1 = find it by the buffer layout (default), N = force index N, 0 = off
; The mod reads the game's shader archive (resource\shader.pak, read only) at start: interface shaders, the scene buffer
; size and the exposure shaders' sources come from there, so a game update that recompiles shaders keeps the mod working.
; dof_radius   depth of field: the blur radius (in pixels of the mod's larger blur image) is multiplied by s^dof_radius,
;          s = how much larger that image is. 2 = blurred as the game blurs at the world resolution (default),
;          1 = as at the logical resolution, 0 = off
; stretch_copy 1 = copies from unscaled into scaled textures are stretched (inventory item icons)
; fit_native   1 = scale is fitted so the native mode divides exactly (2560x1440 x1.5 -> 160/107)
; monitor      native resolution of the monitor is the Windows desktop resolution; WxH here only to override it
; all_monitors 1 = the resolution list also has entries for other monitors of another size (e.g. a 21:9 one next to a 4K
;              main display); applying such an entry moves the game to that monitor. 0 = main display only
; d3d_debug    1 = the Direct3D debug layer checks every call (needs the Windows optional feature "Graphics Tools") and
;              its errors and warnings go to ui4k.log - for bug hunting (AMD / Intel), the game runs slower
; game_hdr     the game's HDR setting is read from its profile (at start and whenever the game applies settings);
;              set 0/1 here only to override
; game_aa      same for the game's MSAA setting (0 = off, 2/4/8/16 = samples); read from the profile, only to override
; dpi_aware    1 = the mod declares the game DPI aware (needed when Windows display scale is not 100%); 0 = leave as is
; msaa_safe    0 = the 3D world keeps the size of the entry also while MSAA is on in the game (default);
;              1 = safe mode: while MSAA is on, the world is rendered at interface size on every entry - a fallback
;              if MSAA with a smaller world misbehaves
[ui4k]
enabled=1
presets=1
labels=1
scale=1.5
log=1
diag=0
lum_fix=1
cb_fix=156,84
scan_cb=0
stretch_copy=1
fit_native=1
