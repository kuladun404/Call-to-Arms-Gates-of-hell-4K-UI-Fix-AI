; UI x2 / 4K render proxy for Call to Arms - Gates of Hell
; enabled     0 = pure passthrough
; scale       physical / logical resolution (game set to 1920x1080 -> rendered 3840x2160)
; scale_ui_rt 1 = also scale UI widget render targets (sharper widgets)
; cb_fix      constant-buffer sizes (in floats) whose screen constants are made physical:
;             156 = scene/post-process constants, 84 = NVIDIA HBAO+ constants
; scan_cb     1 = log screen constants found in constant buffers (diagnostics)
; log         0 off, 1 main, 2 verbose (+ create ui4k.dump next to the DLL to dump one frame)
; font_hd     1 = sharp font atlases x2 from ui4k_fonts\ (tools/make_fonts.py); 0 = off
; font_big    1 = also 2048x1024 pages (Arial Unicode "main", 32 MB VRAM each; patched by .pat)
; font_filter sharp = smooth x2 with crisp edges (default); nearest = pixel blocks 2x2; bilinear = soft
; font_dump   1 = dump uploaded atlases to ui4k_dump\ (diagnostics)
[ui4k]
enabled=1
scale=2
scale_ui_rt=1
cb_fix=156,84
scan_cb=0
log=1
font_hd=1
font_big=1
font_filter=sharp
